services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: math_learning
      POSTGRES_USER: math_app
      POSTGRES_PASSWORD: math_app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U math_app -d math_learning"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - math_learning_postgres:/var/lib/postgresql/data

volumes:
  math_learning_postgres:
